<!DOCTYPE html>
<html lang="en">
<head>
   <title>3D Strange Attractors</title>
   <script type="module" src="./src/main.js"></script>
   <link rel="stylesheet" href="./style.css">
</head>
<body>
   <canvas id="canvas" width="1200" height="600"></canvas>

   <div class="row">
      <div class="column">
         <table>
            <tr><th colspan="3">View controls</th></tr>
            <tr>
               <td>X-axis</td>
               <td><input type="range" min="-100" max="100" value="0" class="slider" id="view-x"></td>
               <td><span id="view-x-val">0</span></td>
            </tr>
            <tr>
               <td>Y-axis</td>
               <td><input type="range" min="-100" max="100" value="0" class="slider" id="view-y"></td>
               <td><span id="view-y-val">0</span></td>
            </tr>
            <tr>
               <td>Z-axis</td>
               <td><input type="range" min="-100" max="100" value="0" class="slider" id="view-z"></td>
               <td><span id="view-z-val">0</span></td>
            </tr>
            <tr>
               <td>Scale</td>
               <td><input type="range" min="0" max="50" value="10" class="slider" id="view-scale"></td>
               <td><span id="view-scale-val">0</span></td>
            </tr>
         </table>
      </div>

      <div class="column">
         <table>
            <tr><th colspan="3">System parameters</th></tr>
            <tr>
               <td>a</td>
               <td><input type="range" min="-100000" max="100000" value="10000" class="slider" id="attractor-a"></td>
               <td><span id="attractor-a-val">10</span></td>
            </tr>
            <tr>
               <td>b</td>
               <td><input type="range" min="-100000" max="100000" value="28000" class="slider" id="attractor-b"></td>
               <td><span id="attractor-b-val">28</span></td>
            </tr>
            <tr>
               <td>c</td>
               <td><input type="range" min="-100000" max="100000" value="2667" class="slider" id="attractor-c"></td>
               <td><span id="attractor-c-val">2.667</span></td>
            </tr>
         </table>
      </div>

      <div class="column">
         <table>
            <tr><th colspan="3">Simulation controls</th></tr>
            <tr>
               <td>Timestep size</td>
               <td><input type="range" min="1" max="1000" value="100" class="slider" id="sim-step"></td>
               <td><span id="sim-step-val">0.01</span></td>
            </tr>
            <tr>
               <td>Time interval start</td>
               <td><input type="range" min="-5000" max="5000" value="0" class="slider" id="sim-start"></td>
               <td><span id="sim-start-val">0</span></td>
            </tr>
            <tr>
               <td>Time interval stop</td>
               <td><input type="range" min="-5000" max="5000" value="1000" class="slider" id="sim-stop"></td>
               <td><span id="sim-stop-val">100</span></td>
            </tr>
         </table>
      </div>
   </div>
   <div class="presets">
      <button type="button" data-attractor="lorenz">Lorenz</button>
      <button type="button" data-attractor="rossler">Rössler</button>
      <button type="button" data-attractor="chen">Chen</button>
      <button type="button" data-attractor="aizawa">Aizawa</button>
      <button type="button" id="export-svg">Export SVG</button>
   </div>
</body>
</html>
